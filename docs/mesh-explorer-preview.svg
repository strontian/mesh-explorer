<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MeSH Tree Explorer interface preview</title>
  <desc id="desc">A dark interface preview with MeSH tree navigation, tree cards, selected term detail, query builder, and PubMed action.</desc>
  <defs>
    <linearGradient id="bg" x1="700" y1="0" x2="700" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111520"/>
      <stop offset="1" stop-color="#080A0F"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 230) rotate(136) scale(520 380)">
      <stop stop-color="#98D8C8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#98D8C8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(380 560) rotate(-33) scale(520 360)">
      <stop stop-color="#C3A6FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C3A6FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .mono { font-family: "IBM Plex Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
      .title { font-size: 30px; font-weight: 800; fill: #F1F3F4; }
      .body { font-size: 15px; font-weight: 600; fill: #A8ACB5; }
      .tiny { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; }
      .label { font-size: 16px; font-weight: 800; fill: #E9ECEF; }
      .small { font-size: 13px; font-weight: 700; fill: #8E95A3; }
      .code { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; }
    </style>
  </defs>

  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="760" rx="30" fill="url(#glowA)"/>
  <rect width="1400" height="760" rx="30" fill="url(#glowB)"/>

  <rect x="22" y="22" width="1356" height="716" rx="22" fill="#0B0E14" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <g class="mono">
    <rect x="22" y="22" width="1356" height="70" rx="22" fill="#090C12"/>
    <rect x="22" y="70" width="1356" height="22" fill="#090C12"/>
    <circle cx="47" cy="57" r="5" fill="#AED6F1"/>
    <text x="64" y="62" font-size="16" font-weight="800" fill="#F1F3F4">MeSH Tree Explorer</text>

    <g transform="translate(245 40)">
      <rect x="0" y="0" width="85" height="32" rx="5" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="14" y="21" font-size="13" font-weight="800" fill="#A8D8A8">A</text>
      <text x="35" y="21" font-size="12" font-weight="700" fill="#FFFFFF" fill-opacity="0.55">Anatomy</text>
    </g>
    <g transform="translate(340 40)">
      <rect x="0" y="0" width="104" height="32" rx="5" fill="#98D8C8" fill-opacity="0.13" stroke="#98D8C8" stroke-opacity="0.85"/>
      <text x="14" y="21" font-size="13" font-weight="800" fill="#98D8C8">B</text>
      <text x="35" y="21" font-size="12" font-weight="800" fill="#98D8C8">Organisms</text>
    </g>
    <g transform="translate(454 40)">
      <rect x="0" y="0" width="93" height="32" rx="5" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="14" y="21" font-size="13" font-weight="800" fill="#F4A261">C</text>
      <text x="35" y="21" font-size="12" font-weight="700" fill="#FFFFFF" fill-opacity="0.55">Diseases</text>
    </g>
    <g transform="translate(557 40)">
      <rect x="0" y="0" width="108" height="32" rx="5" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="14" y="21" font-size="13" font-weight="800" fill="#C3A6FF">D</text>
      <text x="35" y="21" font-size="12" font-weight="700" fill="#FFFFFF" fill-opacity="0.55">Chemicals</text>
    </g>
    <g transform="translate(675 40)">
      <rect x="0" y="0" width="110" height="32" rx="5" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="14" y="21" font-size="13" font-weight="800" fill="#7EC8E3">E</text>
      <text x="35" y="21" font-size="12" font-weight="700" fill="#FFFFFF" fill-opacity="0.55">Techniques</text>
    </g>
    <g transform="translate(795 40)">
      <rect x="0" y="0" width="112" height="32" rx="5" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="14" y="21" font-size="13" font-weight="800" fill="#E8A598">F</text>
      <text x="35" y="21" font-size="12" font-weight="700" fill="#FFFFFF" fill-opacity="0.55">Psychology</text>
    </g>
    <g transform="translate(917 40)">
      <rect x="0" y="0" width="122" height="32" rx="5" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="14" y="21" font-size="13" font-weight="800" fill="#AED6F1">M</text>
      <text x="35" y="21" font-size="12" font-weight="700" fill="#FFFFFF" fill-opacity="0.55">Named Groups</text>
    </g>
  </g>

  <g class="mono">
    <rect x="58" y="126" width="46" height="46" rx="9" fill="#98D8C8" fill-opacity="0.13" stroke="#98D8C8" stroke-opacity="0.5"/>
    <text x="75" y="157" font-size="22" font-weight="900" fill="#98D8C8">B</text>
    <text x="120" y="157" class="title">Organisms</text>
    <text x="58" y="205" class="body">Biological taxonomy from domains to species.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="58" y="250" width="1284" height="160" rx="14" fill="#181D21" stroke="#98D8C8" stroke-opacity="0.42"/>
    <text x="84" y="284" class="mono code" fill="#98D8C8">B01</text>
    <text x="84" y="316" class="mono label">Eukaryota</text>
    <text x="1240" y="288" class="mono small">2,624 total</text>
    <g class="mono">
      <rect x="84" y="346" width="94" height="28" rx="14" fill="#98D8C8" fill-opacity="0.10" stroke="#98D8C8" stroke-opacity="0.35"/>
      <text x="101" y="365" class="small">Animals</text>
      <rect x="190" y="346" width="86" height="28" rx="14" fill="#98D8C8" fill-opacity="0.10" stroke="#98D8C8" stroke-opacity="0.35"/>
      <text x="207" y="365" class="small">Fungi</text>
      <rect x="288" y="346" width="86" height="28" rx="14" fill="#98D8C8" fill-opacity="0.10" stroke="#98D8C8" stroke-opacity="0.35"/>
      <text x="305" y="365" class="small">Plants</text>
      <rect x="386" y="346" width="118" height="28" rx="14" fill="#98D8C8" fill-opacity="0.10" stroke="#98D8C8" stroke-opacity="0.35"/>
      <text x="403" y="365" class="small">Alveolata</text>
      <rect x="516" y="346" width="142" height="28" rx="14" fill="#98D8C8" fill-opacity="0.10" stroke="#98D8C8" stroke-opacity="0.35"/>
      <text x="533" y="365" class="small">Viridiplantae</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="58" y="438" width="416" height="194" rx="12" fill="#11151D" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect x="58" y="438" width="416" height="4" rx="2" fill="#98D8C8" fill-opacity="0.75"/>
    <text x="84" y="476" class="mono tiny" fill="#98D8C8">SELECTED TERM</text>
    <text x="84" y="514" class="mono label">Eukaryota</text>
    <text x="84" y="539" class="mono code" fill="#98D8C8">B01</text>
    <text x="84" y="574" class="mono small">One of the three domains of life whose cells</text>
    <text x="84" y="596" class="mono small">are enclosed in membranes and possess a nucleus.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="496" y="438" width="846" height="194" rx="12" fill="#11151D" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="526" y="480" class="mono label">Query 1</text>
    <rect x="526" y="505" width="160" height="30" rx="7" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="548" y="525" class="mono small">Dust Mite Allergy</text>
    <rect x="698" y="505" width="96" height="30" rx="7" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="720" y="525" class="mono small">Asthma</text>
    <rect x="526" y="558" width="690" height="46" rx="8" fill="#AED6F1" fill-opacity="0.08" stroke="#AED6F1" stroke-opacity="0.28"/>
    <text x="548" y="581" class="mono tiny" fill="#AED6F1">RUN QUERY</text>
    <text x="548" y="598" class="mono small">Open this MeSH filter in PubMed</text>
    <rect x="1230" y="558" width="82" height="46" rx="8" fill="#AED6F1"/>
    <text x="1249" y="587" class="mono" font-size="13" font-weight="900" fill="#091016">PubMed</text>
  </g>
</svg>
